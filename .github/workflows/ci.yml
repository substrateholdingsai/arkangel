name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El workflow sólo lee el repositorio: no necesita permisos de escritura.
permissions:
  contents: read

# Un run por rama: si se empuja otra vez, cancela el anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # La misma versión con la que se verifica en local (package.json
          # exige >=20.18.0; 24 es la línea LTS en la que se corre `npm run verify`).
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verify (format, lint, typecheck, test, build)
        run: npm run verify
